<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Point your phone at the plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  body { overflow: hidden; }
  .ar-wrap { position: fixed; inset: 0; }
  .ar-top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 6; display: flex; flex-wrap: wrap;
    justify-content: center; align-items: center; gap: .35rem .45rem;
    padding: .5rem .6rem; background: linear-gradient(rgba(10,27,40,.9), rgba(10,27,40,0)); font-family: var(--fell);
  }
  .ar-top a { color: var(--paper); text-decoration: none; font-size: .82rem; padding: .22rem .55rem; border: 1px solid rgba(234,227,210,.5); border-radius: 2rem; white-space: nowrap; }
  .ar-status { flex: 1 1 100%; text-align: center; font-style: italic; color: var(--paper-dim); font-size: .9rem; margin-top: .1rem; }
  .reader { transform: translateY(calc(100% + 20px)); transition: transform .3s ease, height .3s ease; }
  .reader.open { transform: none; }
  .reader .close { position: absolute; right: .9rem; top: .6rem; font-family: var(--fell); font-size: 1.4rem; line-height: 1; color: var(--ink-soft); }
  .nocam {
    position: fixed; inset: 0; z-index: 7; display: none; place-items: center; text-align: center; padding: 2rem; background: var(--sea);
  }
  .nocam.show { display: grid; }
  .nocam h2 { font-family: var(--fell); font-weight: 400; font-size: 1.6rem; }
  .nocam a { color: var(--gilt); }
  @media (min-width: 861px) {
    .reader { position: fixed; left: 0; right: 0; bottom: 0; height: 46vh; z-index: 5; border-left: 0; border-radius: 14px 14px 0 0; max-width: 560px; margin: 0 auto; }
  }
  .mindar-ui-overlay.mindar-ui-scanning .inner { border: 0 !important; }
  .ar-strip {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none;
    padding: .7rem .8rem calc(.8rem + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(10,27,40,0), rgba(10,27,40,.92) 45%);
    opacity: 0; transform: translateY(12px); transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .ar-strip::-webkit-scrollbar { display: none; }
  body.ready .ar-strip { opacity: 1; transform: none; pointer-events: auto; }
  body.reading .ar-strip { opacity: 0; transform: translateY(12px); pointer-events: none; }
  .ar-strip button {
    flex: none; font-family: var(--fell); font-size: .95rem; white-space: nowrap;
    color: var(--paper); background: rgba(234,227,210,.12); border: 1px solid rgba(234,227,210,.45);
    border-radius: 2rem; padding: .4rem .85rem; min-height: 40px;
  }
  .ar-strip button.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
</style>
</head>
<body>
<div class="ar-top">
  <a href="index.html">Flat map</a>
  <a href="overview.html">Short version</a>
  <a href="fishes.html">Fish</a>
  <a href="poulos.html">Poulos</a>
  <span class="ar-status">Point the camera at the map</span>
</div>
<div class="ar-wrap">
  <a-scene mindar-image="imageTargetSrc: targets/map.mind; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 3; missTolerance: 8; uiScanning: no; uiLoading: no; uiError: no;"
           color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" id="anchor"></a-entity>
  </a-scene>
</div>
<div id="scanhint" class="stage-hint" style="position:fixed; bottom:2rem; z-index:6;" hidden>Looking for the map…</div>
<div class="nocam" id="nocam">
  <div>
    <h2>The camera could not start</h2>
    <p>This needs a phone with a camera, opened over https, with camera permission allowed. You can still tap through the islands on the <a href="index.html">flat map</a>.</p>
  </div>
</div>
<div id="strip" class="ar-strip" aria-label="Islands on the map"></div>
<aside class="reader" id="reader">
  <div class="handle" aria-hidden="true"></div>
  <button class="close" type="button" aria-label="Close">×</button>
  <div class="reader-inner"></div>
  <div class="tour-nav">
    <button class="prev" type="button">Earlier</button>
    <button class="next" type="button">Later</button>
    <span class="pos"></span>
  </div>
</aside>
<script src="content.js"></script>
<script src="fishes.js"></script>
<script src="app.js"></script>
<script src="audio.js"></script>
<script src="ask.js"></script>
<script>
(function () {
  const D = window.AEGEAN, R = window.AegeanReader;
  const reader = document.getElementById('reader');
  const strip = document.getElementById('strip');
  R.mountReader(reader);
  reader.querySelector('.close').addEventListener('click', () => { reader.classList.remove('open'); document.body.classList.remove('reading'); });
  R.onChange(() => { reader.classList.add('open'); document.body.classList.add('reading'); });

  // The target plane is 1 unit wide in MindAR; height follows the image aspect.
  const W = 1, H = 1348 / 884;
  const anchor = document.getElementById('anchor');
  const label = document.createElement('a-entity');   // one plaque, moved to whichever island is chosen
  const labelText = document.createElement('a-entity');
  label.setAttribute('visible', false);
  label.appendChild(labelText);
  anchor.appendChild(label);

  D.places.forEach(p => {
    const x = (p.x / 100 - 0.5) * W, y = (0.5 - p.y / 100) * H;
    const rx = p.rx / 100 * W, ry = p.ry / 100 * W;

    const wash = document.createElement('a-entity');
    wash.setAttribute('geometry', `primitive: circle; radius: ${rx}; segments: 40`);
    wash.setAttribute('material', 'color: #f0c14b; opacity: 0.5; transparent: true; shader: flat; side: double');
    wash.setAttribute('position', `${x} ${y} 0.005`);
    wash.setAttribute('scale', `1 ${ry / rx} 1`);
    if (p.rot) wash.setAttribute('rotation', `0 0 ${-p.rot}`);
    wash.dataset.wash = p.id;

    const ring = document.createElement('a-entity');
    ring.setAttribute('geometry', `primitive: ring; radiusInner: ${rx * 0.94}; radiusOuter: ${rx * 1.08}; segmentsTheta: 48`);
    ring.setAttribute('material', 'color: #a8402f; opacity: 0; transparent: true; shader: flat; side: double');
    ring.setAttribute('position', `${x} ${y} 0.006`);
    ring.setAttribute('scale', `1 ${ry / rx} 1`);
    if (p.rot) ring.setAttribute('rotation', `0 0 ${-p.rot}`);
    ring.dataset.ring = p.id;

    // An invisible, generously sized disc does the catching, so a thumb can miss and still hit.
    const hit = document.createElement('a-entity');
    hit.classList.add('spot');
    hit.dataset.id = p.id;
    const r = Math.max(rx, ry) * 1.9;
    hit.setAttribute('geometry', `primitive: circle; radius: ${r}; segments: 18`);
    hit.setAttribute('material', 'opacity: 0; transparent: true; shader: flat; side: double');
    hit.setAttribute('position', `${x} ${y} 0.01`);
    anchor.append(wash, ring, hit);
  });

  // The strip of island names: a normal DOM control, so it always works.
  strip.innerHTML = D.places.map(p =>
    `<button type="button" data-id="${p.id}">${(p.label || p.modern).split(':')[0].split('(')[0].trim()}</button>`).join('');
  strip.addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (b) R.goToPlace(b.dataset.id);
  });

  R.onChange(st => {
    anchor.querySelectorAll('[data-ring]').forEach(r => r.setAttribute('material', 'opacity', r.dataset.ring === st.placeId ? 1 : 0));
    anchor.querySelectorAll('[data-wash]').forEach(w => w.setAttribute('material', 'opacity', w.dataset.id === st.placeId ? 0.62 : 0.5));
    strip.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === st.placeId));
    const p = R.byId[st.placeId];
    if (p) {
      const x = (p.x / 100 - 0.5) * W, y = (0.5 - p.y / 100) * H;
      const name = (p.label || p.modern).split(':')[0].split('(')[0].trim();
      const w = Math.max(0.16, name.length * 0.032 + 0.05), h = 0.072;
      label.setAttribute('position', `${x} ${y + p.ry / 100 * W + 0.07} 0.02`);
      label.setAttribute('geometry', `primitive: plane; width: ${w}; height: ${h}`);
      label.setAttribute('material', 'color: #eae3d2; opacity: 0.95; shader: flat; side: double');
      labelText.setAttribute('text', `value: ${name}; align: center; color: #231f1a; width: ${w * 2.5}; zOffset: 0.001`);
      labelText.setAttribute('position', '0 0 0.001');
      label.setAttribute('visible', true);
      const b = strip.querySelector(`button[data-id="${st.placeId}"]`);
      if (b) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
  });

  const scene = document.querySelector('a-scene');

  // Tap handling. A-Frame's mouse cursor did not reliably deliver taps here, so the
  // ray is cast by hand from the camera through the point the finger lifted at.
  const ray = new THREE.Raycaster();
  let down = null;
  function pickAt(cx, cy) {
    if (!scene.camera || !scene.canvas) return;
    const r = scene.canvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, scene.camera);
    const meshes = [];
    anchor.querySelectorAll('.spot').forEach(el => {
      if (!el.object3D) return;
      el.object3D.traverse(o => { if (o.isMesh) { o.userData.spotId = el.dataset.id; meshes.push(o); } });
    });
    const hits = ray.intersectObjects(meshes, false);
    if (hits.length) R.goToPlace(hits[0].object.userData.spotId);
  }
  function bindCanvas() {
    const c = scene.canvas;
    if (!c || c.dataset.bound) return;
    c.dataset.bound = '1';
    c.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
    c.addEventListener('pointerup', e => {
      if (!down) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12;
      down = null;
      if (!moved) pickAt(e.clientX, e.clientY);
    });
    c.addEventListener('pointercancel', () => { down = null; });
  }
  if (scene.hasLoaded) bindCanvas(); else scene.addEventListener('loaded', bindCanvas);
  scene.addEventListener('renderstart', bindCanvas);

  const status = document.querySelector('.ar-status');
  const hint = document.getElementById('scanhint');
  scene.addEventListener('arReady', () => { status.textContent = 'Point the camera at the map'; hint.hidden = false; document.body.classList.add('ready'); });
  scene.addEventListener('arError', () => { document.getElementById('nocam').classList.add('show'); });
  anchor.addEventListener('targetFound', () => {
    status.textContent = 'Found it';
    hint.hidden = true; document.body.classList.add('found');
  });
  anchor.addEventListener('targetLost', () => {
    status.textContent = 'Point the camera at the map';
    document.body.classList.remove('found');
    if (!reader.classList.contains('open')) hint.hidden = false;
  });
  R.onChange(() => { hint.hidden = true; });
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) document.getElementById('nocam').classList.add('show');
})();
</script>
</body>
</html>
